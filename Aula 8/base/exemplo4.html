<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Lista de Mercado Inteligente</title>
  <link rel="stylesheet" href="css/exemplo4.css">
</head>

<body>

  <div class="card-compras">
    <h3>🛒 Minha Lista de Mercado</h3>

    <div class="linha-add">
      <input type="text" id="campoProduto" placeholder="Ex: Arroz 5kg, Feijão...">
      <button id="btnAdicionar" class="btn-adicionar">Adicionar</button>
    </div>

    <ul id="listaElementos"></ul>

    <div class="painel-resumo" id="resumoCarrinho">
      Carregando itens...
    </div>

    <button id="btnLimpar" class="btn-limpar-tudo">Apagar Toda a Lista</button>
  </div>

  <script src="js/exemplo4.js"></script>
</body>

</html>
