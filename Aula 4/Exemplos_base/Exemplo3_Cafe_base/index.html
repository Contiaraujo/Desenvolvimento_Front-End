<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 3</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <figure>
        <img src="imagens/cafe.jpg" alt="Foto do Café Java">
        <figcaption>
            <div class="header-container">
                <h1>Café Java</h1>
                <div class="dist"><img src="imagens/marker.PNG" alt="Marker"> 12km</div>
            </div>

            <div class="estrelas">
                <img src="imagens/5-star-rating.png" alt="5 Estrelas"> 4.8 (23)
            </div>

            <h3>$$$ Café brasileiro</h3>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi, deserunt ullam? Debitis fuga impedit architecto facere numquam nam soluta aperiam aliquid perspiciatis? Repellat inventore nisi laudantium ratione sint praesentium exercitationem.</p>
            <hr>

            <h3 class="dias">Sexta a Domingo</h3>

            <div class="horarios-container">
                <img src="imagens/clock.PNG" class="clock" alt="Relógio">
                <div class="horario">
                    <div>5:30PM</div>
                    <div>7:30PM</div>
                    <div>9:30PM</div>
                </div>
            </div>

            <div class="reserva">Reservar</div>
        </figcaption>
    </figure>
</body>

</html>
